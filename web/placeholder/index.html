<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumaat</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #faf7f2;
        color: #2b2118;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1d1914; color: #f2ebe2; }
      }
      main { text-align: center; padding: 24px; }
      h1 { font-size: 2.5rem; margin: 0 0 12px; }
      p { margin: 6px 0; }
      #api { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sumaat</h1>
      <p>Pickup food ordering in Al-Ahsa. The app is coming soon.</p>
      <p>API: <span id="api">checking…</span></p>
    </main>
    <script>
      // Proves CloudFront routes /api/* to API Gateway (same address, no CORS).
      fetch("/api/health")
        .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
        .then((b) => { document.getElementById("api").textContent = b.status === "ok" ? "✅ reachable" : "⚠️ unexpected answer"; })
        .catch((e) => { document.getElementById("api").textContent = "❌ not reachable (" + e + ")"; });
    </script>
  </body>
</html>

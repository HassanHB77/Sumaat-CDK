[project]
name = "sumaat"
version = "0.1.0"
description = "Sumaat: pickup-only food ordering POC for Al-Ahsa (AWS CDK)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-cdk-lib>=2.273.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "cdk-nag>=2.37.0,<3.0.0",
    "boto3-stubs~=1.44.0",
]

[dependency-groups]
# What the API Lambda needs at runtime (boto3 is already in the Lambda runtime).
# After changing it: uv lock && uv export --only-group lambda --no-hashes --no-emit-project -o api/requirements.txt
lambda = [
    "fastapi>=0.120",
    "mangum>=0.19",
]
# What the AI agent container needs (Step 9; runs on Bedrock AgentCore Runtime).
# After changing it: uv lock && uv export --only-group agent --no-hashes --no-emit-project -o agent/requirements.txt
agent = [
    "bedrock-agentcore>=1.26.0",
]
dev = [
    {include-group = "lambda"},
    {include-group = "agent"},
    "pytest>=8.4",
    "boto3>=1.40",
    "moto[dynamodb,cognitoidp]>=5.1",
    "httpx>=0.28",
]
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
